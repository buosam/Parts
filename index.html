        "@type": "PostalAddress",
        "streetAddress": "Al-Sinak Auto Parts District",
        "addressLocality": "Baghdad",
        "addressRegion": "Baghdad Governorate",
        "addressCountry": "IQ"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 33.3152,
        "longitude": 44.3661
      },
      "areaServed": [
        "Baghdad", "Erbil", "Basra", "Sulaymaniyah", "Duhok",

      "alternateName": ["سوق العراق لقطع الغيار", "IQ Auto Market", "Iraq Auto Parts"],
      "url": "https://iqautomarket.com",
      "potentialAction": {
        "@type": "SearchAction",
